name: Test MASM guides

on:
  pull_request:
    paths:
      - "docs/builder/smart-contracts/masm/**"
      - "versioned_docs/version-0.17/builder/smart-contracts/masm/**"
      - "examples/masm/**"
      - "scripts/masm/**"
      - "package.json"
      - "package-lock.json"
      - "sidebars.ts"
      - "versioned_sidebars/version-0.17-sidebars.json"
      - "docusaurus.config.ts"
      - "scripts/prepare-local-docs.mjs"
      - ".github/workflows/test-masm-guides.yml"
  push:
    branches: [main]
    paths:
      - "docs/builder/smart-contracts/masm/**"
      - "versioned_docs/version-0.17/builder/smart-contracts/masm/**"
      - "examples/masm/**"
      - "scripts/masm/**"
      - "package.json"
      - "package-lock.json"
      - "sidebars.ts"
      - "versioned_sidebars/version-0.17-sidebars.json"
      - "docusaurus.config.ts"
      - "scripts/prepare-local-docs.mjs"
      - ".github/workflows/test-masm-guides.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "masm-guides-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.masm-target
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20.20.2"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Install site dependencies
        run: npm ci --no-audit --no-fund
      - name: Check MASM types, regressions and source parity
        run: |
          npm run check:masm
      - name: Check transaction guide source parity
        run: |
          node examples/masm/transaction-lab/check-guides.mjs
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .masm-target
          key: masm-linux-rust-1.98.1-dev-debug0-v1-${{ hashFiles('examples/masm/**/Cargo.lock') }}
          restore-keys: masm-linux-rust-1.98.1-dev-debug0-v1-
      - name: Run the documented examples and regressions
        run: |
          cargo +1.98.1 run --locked --manifest-path examples/masm/first-project/Cargo.toml
          cargo +1.98.1 run --locked --manifest-path examples/masm/account-components/Cargo.toml
          cargo +1.98.1 run --locked --manifest-path examples/masm/note-scripts/Cargo.toml
          cargo +1.98.1 test --locked --manifest-path examples/masm/note-scripts/Cargo.toml
          cargo +1.98.1 test --locked --manifest-path examples/masm/regressions/Cargo.toml
          cargo +1.98.1 test --locked --manifest-path examples/masm/transaction-lab/Cargo.toml
      - name: Build the site and check generated MASM navigation
        env:
          NODE_OPTIONS: "--max-old-space-size=12288"
        run: |
          npm run prepare:docs -- --snapshot 0.17
          npm run build
          npm run check:masm-navigation
